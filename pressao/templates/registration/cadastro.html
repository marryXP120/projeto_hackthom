{% extends "pressao/base.html" %}
{% block content %}
<div class="card">
  <h2 style="margin-top:0">Criar conta</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for campo in form %}
      <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
      {{ campo }}
      {% if campo.help_text %}<div class="helptext">{{ campo.help_text|safe }}</div>{% endif %}
      {{ campo.errors }}
    {% endfor %}
    <p style="margin-top:20px">
      <button class="btn" type="submit">Cadastrar</button>
      <a href="{% url 'login' %}">Já tenho conta</a>
    </p>
  </form>
</div>
{% endblock %}
